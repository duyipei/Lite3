local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      always_send_full_costmap: true
      footprint_padding: 0.05
      footprint: '[[0.3, 0.2], [0.3, -0.2], [-0.3, -0.2], [-0.3, 0.2]]'
      global_frame: map
      width: 8
      height: 8
      origin_x: 0.0
      origin_y: 0.0
      plugins:
      - static_layer
      - stvl_obstacle_layer
      - inflation_layer
      publish_frequency: 1.0
      resolution: 0.1
      robot_base_frame: base_link
      rolling_window: true
      track_unknown_space: true
      transform_tolerance: 0.3
      update_frequency: 5.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true
        subscribe_to_updates: false
        map_topic: /map
        map_subscribe_transient_local: true
        track_unknown_space: false
        use_maximum: true
        unknown_cost_value: 0
        trinary_costmap: true
        transform_tolerance: 0.3
      stvl_obstacle_layer:
        plugin: spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer
        observation_sources: rslidar_points
        transform_tolerance: 0.3
        enabled: true
        publish_voxel_map: true
        voxel_size: 0.1
        combination_method: 1
        mark_threshold: 0
        update_footprint_enabled: true
        track_unknown_space: false
        decay_model: 0
        voxel_decay: 1.0
        mapping_mode: false
        map_save_duration: 60.0
        rslidar_points:
          topic: /aligned_points
          sensor_frame: rslidar
          observation_persistence: 0.0
          expected_update_rate: 0.5
          data_type: PointCloud2
          min_obstacle_height: 0.15
          max_obstacle_height: 1.2
          inf_is_valid: false
          marking: true
          clearing: false
          min_z: 0.2
          max_z: 3.0
          vertical_fov_angle: 0.56
          vertical_fov_padding: 0.0
          horizontal_fov_angle: 6.29
          decay_acceleration: 5.0
          filter: passthrough
          voxel_min_points: 0
          clear_after_reading: true
          enabled: true
          model_type: 1
          obstacle_range: 4.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.3
        cost_scaling_factor: 10.0
        inflate_unknown: false
        inflate_around_unknown: false
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      always_send_full_costmap: true
      footprint_padding: 0.05
      footprint: '[[0.3, 0.2], [0.3, -0.2], [-0.3, -0.2], [-0.3, 0.2]]'
      global_frame: map
      width: 30
      height: 30
      origin_x: 0.0
      origin_y: 0.0
      plugins:
      - static_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.1
      robot_base_frame: base_link
      rolling_window: false
      track_unknown_space: true
      transform_tolerance: 0.3
      update_frequency: 5.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true
        subscribe_to_updates: true
        map_topic: /map
        map_subscribe_transient_local: true
        track_unknown_space: true
        use_maximum: true
        unknown_cost_value: 255
        trinary_costmap: true
        transform_tolerance: 0.3
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.3
        cost_scaling_factor: 10.0
        inflate_unknown: false
        inflate_around_unknown: false
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.4
      use_astar: false
      allow_unknown: false
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 5.0
    progress_checker_plugin: progress_checker
    goal_checker_plugin: goal_checker
    controller_plugins:
    - FollowPath
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    odom_topic: /odom
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
      movement_time_allowance: 45.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.20
      # Success must satisfy position AND heading at the same instant.
      stateful: false
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.15
      max_vel_y: 0.0
      max_vel_theta: 0.4
      # DWB rejects a sample only when BOTH translation and rotation are small.
      # Positive min_speed_xy still permits pure rotation at >= min_speed_theta.
      min_speed_xy: 0.03
      max_speed_xy: 0.15
      min_speed_theta: 0.10
      acc_lim_x: 0.2
      acc_lim_y: 0.1
      acc_lim_theta: 0.50
      decel_lim_x: -0.25
      decel_lim_y: -0.1
      decel_lim_theta: -0.50
      vx_samples: 11
      vy_samples: 1
      vtheta_samples: 31
      sim_time: 2.5
      discretize_by_time: false
      linear_granularity: 0.1
      angular_granularity: 0.1
      critics:
      - ObstacleFootprint
      - Oscillation
      - RotateToGoal
      - PathAlign
      - GoalAlign
      - PathDist
      - GoalDist
      # Start the terminal turn inside the acceptance radius, leaving 0.15 m
      # for stepping/localization variation; do not loosen final acceptance.
      xy_goal_tolerance: 0.20
      trans_stopped_velocity: 0.03
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      # Near the path endpoint, advancing the body can move the forward
      # alignment point beyond the path. Goal progress must outweigh that
      # one-cell alignment penalty; otherwise pure turns can win indefinitely.
      GoalDist.scale: 48.0
      GoalDist.aggregation_type: last
      PathAlign.scale: 32.0
      # Distance-based sampling has more poses at higher speeds: summing costs
      # penalizes useful turns simply for having more samples. Score endpoints.
      PathAlign.aggregation_type: last
      PathAlign.forward_point_distance: 0.325
      # Nose-to-position attraction competes with the requested terminal yaw.
      # PathAlign/PathDist/GoalDist remain active for obstacle-aware tracking.
      GoalAlign.scale: 0.0
      GoalAlign.aggregation_type: last
      GoalAlign.forward_point_distance: 0.325
      PathDist.scale: 32.0
      PathDist.aggregation_type: last
      ObstacleFootprint.scale: 0.02
      ObstacleFootprint.max_scaling_factor: 0.2
      ObstacleFootprint.scaling_speed: 0.15
      transform_tolerance: 0.2
      short_circuit_trajectory_evaluation: true
      publish_evaluation: true
      debug_trajectory_details: true
      publish_global_plan: true
      publish_transformed_plan: true
      publish_local_plan: true
      publish_trajectories: false
      publish_cost_grid_pc: false
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: /home/duyipei/Lite3_Projects/lite3_patrol_project/navigation/outdoor_20260921_003_area_review/patrol_map.yaml
    topic_name: map
    frame_id: map
recoveries_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 1.0
    recovery_plugins:
    - wait
    wait:
      plugin: nav2_recoveries/Wait
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.3
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.5
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 10
    stop_on_failure: true
