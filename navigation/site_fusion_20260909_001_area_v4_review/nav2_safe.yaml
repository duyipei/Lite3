planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.2
      use_astar: false
      allow_unknown: false
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 5.0
    progress_checker_plugin: progress_checker
    goal_checker_plugin: goal_checker
    controller_plugins:
    - FollowPath
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    odom_topic: /odom
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
      movement_time_allowance: 45.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 3.14159
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.15
      max_vel_y: 0.0
      max_vel_theta: 0.25
      # Lite3 only steps in place below this value.  Reject the ineffective
      # 0.021/0.043 m/s DWB samples while still allowing a zero-linear turn.
      min_speed_xy: 0.06
      max_speed_xy: 0.15
      min_speed_theta: 0.08
      acc_lim_x: 0.2
      acc_lim_y: 0.1
      acc_lim_theta: 0.25
      decel_lim_x: -0.25
      decel_lim_y: -0.1
      decel_lim_theta: -0.30
      # Produces 0.00, 0.03, 0.06, 0.09, 0.12 and 0.15 m/s.  Combined with
      # min_speed_xy above, 0.06 m/s is the first legal forward sample.
      vx_samples: 6
      vy_samples: 1
      vtheta_samples: 21
      # A longer angular horizon lets DWB distinguish a useful turn from a
      # straight trajectory when the path starts roughly 90 degrees away.
      sim_time: 4.0
      discretize_by_time: false
      linear_granularity: 0.1
      angular_granularity: 0.1
      critics:
      - ObstacleFootprint
      - Oscillation
      - PathAlign
      - GoalAlign
      - PathDist
      - GoalDist
      # Use the standard differential-drive scoring set.  Backward and lateral
      # motion are already impossible from the velocity bounds, so additional
      # angular penalties only prevent required path alignment.
      GoalDist.scale: 24.0
      GoalDist.aggregation_type: last
      PathAlign.scale: 96.0
      PathAlign.aggregation_type: sum
      PathAlign.forward_point_distance: 0.50
      GoalAlign.scale: 48.0
      GoalAlign.aggregation_type: last
      GoalAlign.forward_point_distance: 0.50
      PathDist.scale: 32.0
      PathDist.aggregation_type: sum
      ObstacleFootprint.scale: 0.02
      ObstacleFootprint.max_scaling_factor: 0.2
      ObstacleFootprint.scaling_speed: 0.15
      transform_tolerance: 0.2
      short_circuit_trajectory_evaluation: true
      publish_evaluation: false
      publish_global_plan: true
      publish_transformed_plan: true
      publish_local_plan: true
      publish_trajectories: false
      publish_cost_grid_pc: false
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: /home/duyipei/Lite3_Projects/lite3_patrol_project/navigation/site_fusion_20260909_001_area_v4_review/patrol_map.yaml
