visual_pose_initializer:
  ros__parameters:
    # The database is built in this LiDAR map's coordinates, but this must
    # stay false until the first live visual pose has also been verified.
    configured: false
    visual_pose_topic: /visual_localization/pose
    visual_map_frame: visual_map
    lidar_map_frame: map

    # T_lidar_map_visual_map, planar form. Do not assume identity merely
    # because both systems call their frame "map".
    map_transform_x: 0.0
    map_transform_y: 0.0
    map_transform_z: 0.0
    map_transform_yaw: 0.0

    stable_samples: 10
    stable_duration_s: 0.8
    max_sample_gap_s: 2.5
    max_position_std_m: 0.12
    max_yaw_std_rad: 0.12
    max_visual_covariance_xy: 0.25

    ndt_confirmation_samples: 15
    ndt_settle_s: 3.0
    ndt_timeout_s: 12.0
    max_ndt_position_delta_m: 0.30
    max_ndt_yaw_delta_rad: 0.27
    auto_initialize: false
    odom_topic: /odom
    initialpose_topic: /initialpose
    ready_topic: /patrol/localization_ready

    # Continue supervising NDT after the initial five-sample confirmation.
    # These limits cover the complete 683x337 map and reject the catastrophic
    # multi-kilometre jump observed during the first field precheck.
    map_min_x: -13.2
    map_max_x: 55.1
    map_min_y: -13.1
    map_max_y: 20.6
    max_ready_odom_step_m: 0.50
    max_ready_odom_speed_mps: 1.0
    max_ready_yaw_step_rad: 0.35
    ready_odom_max_age_s: 0.70
    ready_visual_max_age_s: 4.0
    max_ready_visual_position_delta_m: 0.75
    max_ready_visual_yaw_delta_rad: 0.50
    ready_visual_bad_samples: 3
